name: Build and Deploy WASM Demo

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore FSMDemo.Wasm/FSMDemo.Wasm.csproj

    - name: Build
      run: dotnet publish FSMDemo.Wasm/FSMDemo.Wasm.csproj -c Release -o release --nologo
      
    - name: Change base-tag in index.html from / to AnotherFSM
      run: sed -i 's/<base href="\/" \/>/<base href="\/AnotherFSM\/" \/>/g' release/wwwroot/index.html
    
    - name: Copy index.html to 404.html
      run: cp release/wwwroot/index.html release/wwwroot/404.html

    - name: Add .nojekyll file
      run: touch release/wwwroot/.nojekyll
      
    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: gh-pages
        folder: release/wwwroot
