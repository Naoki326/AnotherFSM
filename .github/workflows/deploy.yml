name: Build and Deploy React WASM Editor

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: |
          demos/FSMDemo.Frontend/package-lock.json
          tools/package-lock.json
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Install frontend dependencies
      run: npm ci --prefix demos/FSMDemo.Frontend
    - name: Install repository tool dependencies
      run: npm ci --prefix tools --ignore-scripts
    - name: Lint frontend
      run: npm run lint --prefix demos/FSMDemo.Frontend
    - name: Test Rider acceptance tool contracts (offline)
      run: python3 -m unittest discover -s rider/tools/tests -v
    - name: Test Rider diagnostic journal (SDK-free)
      run: dotnet test rider/tests/diagnostics/IndexDiagnostics.Tests.csproj --nologo -p:NuGetAudit=false
    - name: Test shared behavior and graph projection
      run: |
        dotnet test AnotherFSM.sln --nologo -p:NuGetAudit=false
        npm test --prefix demos/FSMDemo.Frontend
        node --test tools/test/*.test.mjs
    - name: Build and verify real Release WASM at project subpath
      run: |
        cd demos/FSMDemo.Frontend
        npx playwright install --with-deps chrome
        cd ../..
        RUNTIME_CONTRACT=true bash tools/build-browser.sh
        node tools/run-browser-tests.mjs
    - name: Publish without test harness
      run: bash tools/build-browser.sh
    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: gh-pages
        folder: release/wwwroot
